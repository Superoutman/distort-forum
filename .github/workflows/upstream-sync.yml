name: Upstream Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mariadb:
        image: mariadb:10.11.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: lobsters_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      DATABASE_URL: trilogy://root:root@127.0.0.1/lobsters_dev
      RAILS_ENV: test
      RUBYOPT: "--yjit --enable-frozen-string-literal --debug-frozen-string-literal"

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install libvips dependency
        run: |
          sudo apt update
          sudo apt install -y libvips

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/lobsters/lobsters.git || true
          git fetch upstream main

      - name: Stop if already current
        id: current
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream
        if: steps.current.outputs.current == 'false'
        run: |
          branch="upstream-sync/$(date -u +%Y-%m-%d)"
          git checkout -b "$branch"
          git merge --no-edit upstream/main
          echo "branch=$branch" >> "$GITHUB_ENV"

      - name: Prepare test credentials
        if: steps.current.outputs.current == 'false'
        run: cp .github/workflows/check/* config/

      - name: Load database schema
        if: steps.current.outputs.current == 'false'
        run: ./bin/rails db:schema:load db:migrate

      - name: Run validation
        if: steps.current.outputs.current == 'false'
        run: |
          bundle exec rspec
          bundle exec rspec spec/slow/*_spec.rb
          bundle exec standardrb
          bundle exec brakeman --ensure-ignore-notes
          bundle exec database_consistency --config .database_consistency.ignore.yml

      - name: Verify theme hook
        if: steps.current.outputs.current == 'false'
        run: rg 'stylesheet_link_tag "site_theme"' app/views/layouts/application.html.erb

      - name: Push sync branch
        if: steps.current.outputs.current == 'false'
        run: git push origin "$branch"

      - name: Open pull request
        if: steps.current.outputs.current == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "$branch" \
            --title "同步 Lobsters 上游更新 $(date -u +%Y-%m-%d)" \
            --body "自动检测到 Lobsters 上游 main 有新提交。本 PR 已尝试合并并运行测试、lint、安全检查、数据库一致性检查和主题加载钩子检查。"
